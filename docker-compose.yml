services:
  db:
    image: postgres:15-alpine
    container_name: dam-db
    environment:
      POSTGRES_USER: final_user
      POSTGRES_PASSWORD: final_pass
      POSTGRES_DB: final_assignment_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U final_user -d final_assignment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio
    container_name: dam-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password_123
      MINIO_SERVER_URL: http://localhost:9000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  be:
    build:
      context: ./be
    container_name: dam-be
    environment:
      DATABASE_URL: postgresql://final_user:final_pass@db:5432/final_assignment_db
      MINIO_ENDPOINT: minio:9000
      MINIO_EXTERNAL_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_password_123
      MINIO_BUCKET_NAME: eeg-data-bucket
      MINIO_SECURE: "False"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  fe:
    build:
      context: ./fe
    container_name: dam-fe
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - be

volumes:
  postgres_data:
  minio_data:
